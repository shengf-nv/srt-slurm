# DeepSeek-V4-Flash, SGLang disaggregated prefill/decode behind the Dynamo frontend.
#
# Converted from a single-node aggregated `sglang.launch_server` script. One TP4/DP4/EP4
# prefill worker and one identical decode worker share an 8-GPU node (`nodes: colocate`
# places decode on the prefill node's spare GPUs). srtctl pins CUDA_VISIBLE_DEVICES per
# worker, adds `--disaggregation-mode`, the bootstrap port, host and port.
# Decode-only: `cuda-graph-max-bs`. Prefill-only: `chunked-prefill-size`.
# Set `model.path` to your checkpoint directory (or a srtslurm.yaml alias).

schema: 2
name: "dsv4-flash-sglang-dynamo-disagg"

slurm:
  time_limit: "01:00:00"

model:
  path: "DeepSeek-V4-Flash"
  container: "sglang_rtx"
  precision: "fp4"

resources:
  gpus_per_node: 8

# dynamo.sglang needs blake3, which the container lacks (runs before the dynamo install).
setup_script: "install-blake3.sh"

dynamo:
  source:
    pypi: "1.4.2"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

# Env shared by both roles (DeepEP v2 settings from the Aug-1 best practice).
environment:
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  SGLANG_SM120_FLASHMLA_BACKEND: "flashinfer"
  SGLANG_OPT_USE_TILELANG_INDEXER: "0"
  DG_ENABLE_DSV4_DENSE_LAYOUT_OVERRIDES: "1"
  EP_DISABLE_GIN: "1"
  NCCL_LSA_TEAM_SIZE: "4"
  SGLANG_DEEPEP_V2_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "2048"
  SGLANG_DEEPEP_V2_NUM_SMS: "12"
  SGLANG_OPT_FIX_MEGA_MOE_MEMORY: "true"
  SGLANG_OPT_SWIGLU_CLAMP_FUSION: "true"
  SGLANG_OPT_USE_JIT_EP_ACTIVATION: "true"
  NCCL_CUMEM_ENABLE: "1"

engine: sglang
roles:
  prefill:
    nodes: 14
    workers: 14
    gpus: 4
    args:
      served-model-name: "deepseek-ai/DeepSeek-V4-Flash"
      trust-remote-code: true
      tensor-parallel-size: 4
      data-parallel-size: 4
      enable-dp-attention: true
      expert-parallel-size: 4
      pipeline-parallel-size: 1
      moe-runner-backend: "deep_gemm"
      chunked-prefill-size: 4096
      mem-fraction-static: 0.70
      disable-flashinfer-autotune: true
      disable-radix-cache: true
      skip-server-warmup: true
      dsa-paged-mqa-logits-backend: "deepgemm"
      enable-deepseek-v4-fp4-indexer: true
      moe-a2a-backend: "deepep_v2"
      deepep-v2-mode: "direct"
      deepep-v2-dispatcher-output-dtype: "fp8"
  decode:
    nodes: colocate
    workers: 14
    gpus: 4
    args:
      served-model-name: "deepseek-ai/DeepSeek-V4-Flash"
      trust-remote-code: true
      tensor-parallel-size: 4
      data-parallel-size: 4
      enable-dp-attention: true
      expert-parallel-size: 4
      pipeline-parallel-size: 1
      moe-runner-backend: "deep_gemm"
      mem-fraction-static: 0.70
      disable-flashinfer-autotune: true
      disable-radix-cache: true
      skip-server-warmup: true
      cuda-graph-max-bs: 16
      dsa-paged-mqa-logits-backend: "deepgemm"
      enable-deepseek-v4-fp4-indexer: true
      moe-a2a-backend: "deepep_v2"
      deepep-v2-mode: "direct"
      deepep-v2-dispatcher-output-dtype: "fp8"

benchmark:
  type: "sa-bench"
  isl: 1024
  osl: 1024
  concurrencies: "1"
  # DeepSeek-V4 ships no jinja chat_template; this adapter applies its own encoding.
  custom_tokenizer: "sa_bench_tokenizers.sglang_deepseek_v4.SGLangDeepseekV4Tokenizer"
